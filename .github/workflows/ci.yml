name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile
        run: python -m py_compile dpi.py

      - name: Smoke test
        run: |
          python dpi.py --version
          python dpi.py strategies

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck dpi.command install-service.sh uninstall-service.sh \
                     DPI.app/Contents/MacOS/dpi-launcher
